<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenFusion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 3 28 10v12L16 29 4 22V10z%22 fill=%22%23b5762a%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>OpenFusion</b><button class="file" id="file" type="button" title="File"></button></div>
    <nav class="tools" id="tools" aria-label="Tools"></nav>
    <div class="top-right">
      <button id="undo" disabled>Undo</button>
      <button id="redo" disabled>Redo</button>
      <button id="export-btn" aria-pressed="false">Export…</button>
      <button id="params-btn" aria-pressed="false"><span aria-hidden="true" class="fx">ƒx</span> Parameters</button>
      <button id="script-btn" aria-pressed="false" title="Show the script (Cmd+E)">Script</button>
      <button id="help-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
    </div>
  </header>

  <aside class="browser" aria-label="Browser">
    <section>
      <h2>Bodies</h2>
      <ul class="bodies" id="bodies"></ul>
    </section>
    <section>
      <h2 class="with-btn">Parameters <span class="unit">mm, degrees</span><button type="button" id="params-edit" class="mini" title="Open the Parameters table">Edit…</button></h2>
      <table class="params" id="params"></table>
      <form class="addparam" id="addparam">
        <input id="np-name" placeholder="name" aria-label="New parameter name" autocomplete="off">
        <input id="np-value" placeholder="value" aria-label="New parameter value" autocomplete="off">
        <button type="submit">Add</button>
      </form>
    </section>
  </aside>

  <main class="stage">
    <canvas id="view" aria-label="3D view"></canvas>
    <div class="overlay-tl">
      <div class="grp" role="group" aria-label="Select">
        <button data-filter="auto" aria-pressed="true" title="Faces and edges, like Fusion. Body tools use the body.">Faces &amp; edges</button>
        <button data-filter="body" aria-pressed="false" title="Clicks pick whole bodies">Bodies</button>
        <button data-filter="face" aria-pressed="false">Faces</button>
        <button data-filter="edge" aria-pressed="false">Edges</button>
      </div>
      <div class="grp" role="group" aria-label="Show">
        <button id="t-anchors" aria-pressed="false">Anchors</button>
        <button id="t-ghosts" aria-pressed="false">Removed</button>
        <button id="t-origin" aria-pressed="false" title="The origin planes (XY, XZ, YZ): click one to sketch on it or use it as a plane">Origin</button>
        <button id="t-grid" aria-pressed="true">Grid</button>
        <button id="t-section" aria-pressed="true" hidden title="The view is cut open (Section). Click to close the cut.">Section ✕</button>
      </div>
    </div>
    <div class="cube-wrap">
      <canvas id="viewcube" aria-label="View cube: click a face, edge or corner to look from there; drag to orbit"></canvas>
      <div class="cube-btns">
        <button id="home-view" title="Home view (Option+0)" aria-label="Home view"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
        <button id="fit-view" title="Fit all (Option+F)" aria-label="Fit all"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="dialog" id="dialog" hidden></div>
    <div class="attrs" id="attrs" hidden role="dialog" aria-label="Attributes"></div>
    <div class="xpanel" id="export-panel" hidden role="dialog" aria-label="Export"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="selbox" id="selbox" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <div class="selinfo" id="selinfo" hidden aria-live="polite"></div>
    <div class="status"><code id="hover">Click a face or edge to select it; double-click selects the body.</code><span id="sel"></span><span class="perf" id="grid-step"></span><span class="perf" id="perf"></span></div>
  </main>

  <aside class="editor" id="editor-pane" hidden aria-label="Script">
    <div class="editor-head"><b>Script</b><span id="editor-state"></span><button id="editor-save">Save</button></div>
    <div id="editor"></div>
  </aside>

  <footer class="timeline" aria-label="Timeline">
    <div class="tl-label">Timeline</div>
    <ol class="tl" id="timeline"></ol>
  </footer>
</div>
<div class="start" id="start" hidden></div>
<div class="ctx" id="ctx" hidden></div>
<div class="help" id="help" hidden></div>
<div class="pp" id="params-panel" hidden></div>
<div class="pp" id="docs-panel" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
